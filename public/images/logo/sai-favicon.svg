<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- SAI Hexagonal Symbol - 3 interlocking ribbon bands -->
  <!-- Band 1: Top-left to Bottom-left (Blue left side) -->
  <polygon points="18,8 12,11 12,35 18,38 18,14 24,11" fill="#506882"/>
  <!-- Band 2: Bottom to Bottom-right (Gold bottom-right) -->
  <polygon points="24,53 32,57 46,49 46,43 34,50 24,46" fill="#a48c4f"/>
  <!-- Band 3: Top-right to Upper-right (Blue upper-right) -->
  <polygon points="46,14 46,8 32,0 24,4 38,11 38,18" fill="#506882"/>

  <!-- Band 1 continued: Lower-left to Bottom (Blue bottom-left) -->
  <polygon points="12,35 12,41 24,49 26,47 18,42 18,38" fill="#506882"/>
  <!-- Band 2 continued: Top to Top-right (Gold top) -->
  <polygon points="40,11 46,14 46,21 40,18 32,22 26,18" fill="#a48c4f"/>
  <!-- Band 3 continued: Right to Bottom-right (Gold right side) -->
  <polygon points="46,25 52,22 52,46 46,49 46,43 46,25" fill="#a48c4f"/>

  <!-- Overlap corrections for weaving effect -->
  <!-- Gold band top: from upper-left going to top-right -->
  <polygon points="26,4 18,8 24,11 32,7" fill="#a48c4f"/>
  <!-- Blue band: upper-right going down right side -->
  <polygon points="46,21 52,18 52,42 46,45 46,39 46,21" fill="#506882"/>
  <!-- Gold band: bottom-left to bottom-center -->
  <polygon points="18,42 18,46 26,50 32,47 24,43 18,42" fill="#a48c4f"/>
</svg>
